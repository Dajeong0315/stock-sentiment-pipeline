# ponytail: stock ollama/ollama image has no model baked in — after this deploys, run
# `kubectl exec deploy/ollama -- ollama pull qwen2.5:3b-instruct-q4_K_M` once. An initContainer
# that pulls automatically would be the next step if this needs to be hands-off.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models-pvc
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
spec:
  replicas: 1
  selector:
    matchLabels: {app: ollama}
  template:
    metadata:
      labels: {app: ollama}
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
spec:
  selector: {app: ollama}
  ports:
    - port: 11434
      targetPort: 11434
